services:
  postgres:
    image: postgres:16-alpine
    container_name: saas-template-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for product images. Local development uses the Bitnami-packaged
  # MinIO server because MinIO removed its community Docker Hub/Quay images.
  # Any S3-compatible service works in production: point the S3_* variables at it.
  minio:
    image: bitnamilegacy/minio:latest
    container_name: store-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: bitnamilegacy/minio-client:latest
    container_name: store-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/store-media &&
             mc anonymous set download local/store-media"

volumes:
  postgres-data:
  minio-data:
